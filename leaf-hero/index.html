<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶芽勇者 · 二十境远行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091b23;color:#e9f6ed;font-family:"Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(ellipse at 20% 0%,#214634 0,transparent 55%)}main{max-width:1200px;margin:auto;padding:24px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.brand{font-size:24px;font-weight:900;letter-spacing:3px}.brand small{display:block;font-size:10px;letter-spacing:4px;color:#a0b8a9;margin-top:5px}.tag{font-size:12px;color:#b7cdbd;border:1px solid #456052;border-radius:30px;padding:9px 16px}.hud{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0;font-size:14px}.heart{color:#ff8b87;letter-spacing:3px}.stage{color:#dbef9b;font-weight:bold}#shell{position:relative;border:1px solid #5c7764;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #0006}canvas{display:block;width:100%;aspect-ratio:1120/630;background:#183e35}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#061d24a8;backdrop-filter:blur(5px)}.card{text-align:center;max-width:640px;padding:28px}.eyebrow{color:#d4eca1;letter-spacing:5px;font-size:12px}h1{font-size:52px;margin:16px 0 12px;letter-spacing:7px}p{line-height:1.9;color:#d4e4dc;font-size:15px}.primary{background:#daf298;border:0;color:#183624;padding:14px 32px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer;margin:7px}.secondary{background:#173930;color:#d8e8db;border:1px solid #68826a;padding:12px 22px;border-radius:25px;cursor:pointer}.controls{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#a8beb1;margin-top:17px;align-items:center}.controls span{margin-right:8px}kbd{font-family:inherit;background:#243b37;color:#f2f8df;border:1px solid #52705b;border-bottom-width:3px;border-radius:5px;padding:3px 8px;margin-right:4px}.weapons{display:flex;gap:8px;flex-wrap:wrap} .weapon{background:#162f2e;border:1px solid #3c5850;border-radius:8px;padding:8px 12px;color:#91a39b;font-size:12px;cursor:pointer}.weapon.active{color:#e7f6af;border-color:#cee591;background:#354939}.weapon.locked{opacity:.55}footer{display:flex;justify-content:space-between;gap:15px;color:#809b8d;font-size:11px;margin-top:18px;line-height:1.7}#toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#102d2deb;border:1px solid #9ab877;border-radius:30px;padding:10px 22px;color:#e5f1bb;pointer-events:none;white-space:nowrap;font-size:14px}button:hover{filter:brightness(1.14)}@media(max-width:700px){main{padding:12px}.tag{display:none}h1{font-size:30px}.card{padding:15px}p{font-size:12px}.hud{font-size:11px;gap:5px}.brand{font-size:19px}footer{display:block}.weapon{padding:5px}}
</style><link rel="stylesheet" href="../shared/mobile.css"></head><body><main><div class="top"><div class="brand">🌱 叶芽勇者<small>THE LITTLE LEAF · A BIG JOURNEY</small></div><div class="tag">20 个关卡 · 4 片秘境 · 一颗勇敢的心</div></div><div class="hud"><span class="stage" id="stage"></span><span id="life" class="heart"></span><span id="stats"></span><button class="secondary" id="pause" style="padding:6px 14px">暂停 Esc</button></div><div id="shell"><canvas id="game" width="1120" height="630" aria-label="叶芽勇者平台跳跃游戏，使用方向键和A键游玩"></canvas><div id="toast" hidden></div><div id="overlay"></div></div><div class="hud"><div class="weapons" id="weapons"></div><span style="color:#9eb599;font-size:12px">击败怪物 · 收集新武器</span></div><div class="controls"><span><kbd>←</kbd><kbd>→</kbd>移动</span><span><kbd>↑</kbd>跳跃 / 贴树攀爬</span><span><kbd>↓</kbd>下树</span><span><kbd>A</kbd>攻击 / 砍树</span><span><kbd>1–4</kbd>切武器</span><span><kbd>R</kbd>重试</span><span><kbd>Esc</kbd>暂停</span></div><footer><span>找带金色发光图腾的古树！四种武器均可砍树；靠近看进度，按住 A 连续攻击。<br>点亮中途路标可保存本关复活位置；抵达发光树门即可过关。</span><span>本地自动保存已到达关卡 · 无需联网<br>支持手机触控与电脑键盘 · 手机横屏更好玩</span></footer></main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const W=1120,H=630,G=486,GRAV=1250, SPEED=245,JUMP=-570;
const themes=[{name:'萤光丛林',sub:'穿过草叶与古树的低语',sky:'#183f38',haze:'#3d7860',soil:'#284b3c',top:'#93c878',accent:'#e3efa6',far:'#245345'}, {name:'紫焰地狱',sub:'踏过紫色大地，躲开喷涌的焰息',sky:'#291a3e',haze:'#713653',soil:'#583274',top:'#be83e6',accent:'#ffb58d',far:'#462650'}, {name:'潮汐大海',sub:'在浮岛与浪花之间寻找归途',sky:'#173e63',haze:'#529cb7',soil:'#396c7b',top:'#bfe6ca',accent:'#a0e9f6',far:'#276981'}, {name:'冰海极光',sub:'越过雪原，迎着极光向前',sky:'#142c4c',haze:'#607ca2',soil:'#527895',top:'#e2f6f6',accent:'#b9f5e4',far:'#304e70'}];
const weapons=[{name:'长矛',dmg:5,range:102,cool:.42,color:'#e4d6a4'},{name:'重锤',dmg:5,range:66,cool:.60,color:'#bad5db'},{name:'木剑',dmg:4,range:73,cool:.30,color:'#e9b981'},{name:'泡泡枪',dmg:1,range:400,cool:.18,color:'#94eaf9'}];
let keys={},just={},state='title',level=1,world,player,camera=0,t=0,particles=[],shots=[],messageTime=0,kills=0,checkpoint=75,owned=[false,false,true,false],selected=2,attackSerial=0,save=null;
try{save=JSON.parse(localStorage.getItem('leafHero.v1'));if(!save||!Number.isInteger(save.level)||save.level<1||save.level>20)save=null;}catch(e){}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function buildLevel(n){const r=rng(n*7321),len=3050+(n%5)*180,holes=[],spikes=[],traps=[],trees=[],enemies=[],items=[],platforms=[];for(let x=530;x<len-350;x+=500){holes.push({x:x+120,w:85+(n%5)*9});spikes.push({x:x-140,w:38+(n%4)*5});traps.push({x:x+295,w:38,phase:r()*3});}for(let x=265;x<len-150;x+=500){trees.push({x,hp:15,hit:0,totem:false});platforms.push({x:x-62,y:340,w:124});items.push({x:x,y:310,type:'apple',alive:true});}for(let x=410;x<len-160;x+=500){enemies.push({x,y:G-32,w:31,h:32,hp:8+Math.floor((n-1)/5)*3,home:x,dir:-1,alive:true,hit:0,drop:(enemies.length+n-1)%4});}return{len,holes,spikes,traps,trees,enemies,items,platforms,theme:themes[Math.floor((n-1)/5)],flag:Math.floor(len/2/500)*500+265,portal:len-85};}
function start(n=1,continuing=false){level=n;owned=continuing&&Array.isArray(save?.owned)?save.owned.slice(0,4).map(Boolean):[false,false,true,false];owned[2]=true;selected=2;kills=0;loadLevel();}
function loadLevel(){world=buildLevel(level);checkpoint=75;player={x:75,y:G-46,w:28,h:46,vx:0,vy:0,face:1,hp:6,max:6,inv:1,totem:0,ground:true,climb:false,cd:0,attack:0};particles=[];shots=[];camera=0;state='playing';overlay.style.display='none';keys={};just={};persist();toast(`第 ${level} 关 · ${world.theme.name}`);hud();}
function persist(){try{localStorage.setItem('leafHero.v1',JSON.stringify({level,owned}));}catch(e){}}
function toast(s){document.getElementById('toast').textContent=s;document.getElementById('toast').hidden=false;messageTime=3;}
function hud(){document.getElementById('stage').textContent=`${String(level).padStart(2,'0')} / 20　${world.theme.name}`;document.getElementById('life').textContent='♥'.repeat(Math.max(0,player.hp))+'♡'.repeat(player.max-Math.max(0,player.hp));document.getElementById('stats').textContent=`图腾 ${player.totem}　·　击败 ${kills}`;document.getElementById('weapons').innerHTML=weapons.map((w,i)=>`<button class="weapon ${selected===i?'active':''} ${owned[i]?'':'locked'}" onclick="switchWeapon(${i})">${i+1} ${w.name}　${owned[i]?'伤害 '+w.dmg:'未获得'}</button>`).join('');}
function switchWeapon(i){if(owned[i]){selected=i;hud()}else toast('击败怪物后，靠近掉落的武器即可获得');}
function panel(title,desc,buttons){overlay.style.display='flex';overlay.innerHTML=`<div class="card"><div class="eyebrow">A LITTLE LEAF, A BRAVE HEART</div><h1>${title}</h1><p>${desc}</p>${buttons}</div>`;}
function title(){world=buildLevel(1);player={x:170,y:G-46,w:28,h:46,face:1,hp:6,max:6,totem:0,inv:0,attack:0};hud();panel('一片叶子的远行','从萤光丛林出发，走过紫焰、潮汐与冰海。<br>举起木剑，攀上古树，把勇气带到第二十关。<br><b>↑ 跳跃或爬树　← → 移动　A 攻击</b>',`<button class="primary" onclick="start()">开始冒险 →</button>${save?'<button class="secondary" onclick="start(save.level,true)">继续第 '+save.level+' 关</button>':''}`);}
function pause(){if(state==='playing'){state='paused';panel('小憩片刻','叶芽会在这里等你。<br>方向键移动，A 攻击；1—4 切换已获得的武器。','<button class="primary" onclick="resume()">继续冒险</button><button class="secondary" onclick="retry()">重试本关</button>')}else if(state==='paused')resume();}
function resume(){state='playing';overlay.style.display='none';keys={};just={};}
function retry(){loadLevel();}
document.getElementById('pause').onclick=pause;
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','a','A','r','R','Escape','1','2','3','4'].includes(e.key))e.preventDefault();if(!keys[e.key])just[e.key]=true;keys[e.key]=true;if(e.repeat)return;if(e.key==='Escape')pause();if((e.key==='r'||e.key==='R')&&state!=='title')retry();if('1234'.includes(e.key)&&state==='playing')switchWeapon(+e.key-1);});
window.addEventListener('keyup',e=>{keys[e.key]=false});window.addEventListener('blur',()=>{keys={};just={};if(state==='playing')pause()});
function burst(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*160,life:.65,color});}
function hurt(amount,fall=false){if(player.inv>0&&!fall)return;player.hp-=amount;burst(player.x,player.y,'#ffc5a9');if(player.hp<=0){if(player.totem){player.totem--;player.hp=4;player.inv=2.5;toast('不死图腾闪耀！恢复 4 颗心');burst(player.x,player.y,'#ffec82',32);}else{player.hp=0;state='dead';panel('再勇敢一次','草丛与裂隙里藏着危险。<br>从最近的路标复活，保留本关获得的武器。','<button class="primary" onclick="revive()">从路标复活</button><button class="secondary" onclick="retry()">重新开始本关</button>');}}else{player.inv=1.6;if(!fall)player.vy=-240;}if(fall&&state==='playing'){player.x=checkpoint;player.y=G-46;player.vy=0;player.inv=2;}hud();}
function revive(){player.hp=6;player.x=checkpoint;player.y=G-46;player.vy=0;player.inv=2;shots=[];resume();hud();}
function hitEnemy(e,dmg){e.hp-=dmg;e.hit=.2;burst(e.x+15,e.y+10,'#ebde9e',6);if(e.hp<=0){e.alive=false;kills++;world.items.push({x:e.x+15,y:G-22,type:'weapon',weapon:e.drop,alive:true});hud();}}
function hasTreeTotem(tr){return !tr.totem&&(Math.floor(tr.x/500)+level)%3===0;}
function treeLabel(tr){return hasTreeTotem(tr)?'不死图腾树':tr.totem?'图腾已掉落 · 仍可掉苹果':'普通古树 · 只掉苹果';}
function hitTree(tr,damage){tr.hit=.3;tr.lastDamage=damage;tr.hp-=damage;burst(tr.x,player.y+20,'#f2dc87',6);if(tr.hp<=0){const dropsTotem=hasTreeTotem(tr);tr.hp=15;world.items.push({x:tr.x+20,y:G-20,type:'apple',alive:true});if(dropsTotem){tr.totem=true;world.items.push({x:tr.x-25,y:G-24,type:'totem',alive:true});toast('图腾已掉到树根旁！靠近拾取，每棵仅掉一次');burst(tr.x,G-35,'#ffe58c',25);}else toast(tr.totem?'这棵树的图腾已掉落，本次掉落金苹果':'普通古树掉落金苹果；找金色标记的树获得图腾');}}
function drawTreeHint(tr){const x=tr.x,available=hasTreeTotem(tr),near=Math.abs(player.x+14-x)<155;ctx.save();ctx.textAlign='center';if(available){const yy=157+Math.sin(t*3+x)*3;ctx.shadowColor='#ffe880';ctx.shadowBlur=24;ellipse(x,yy,27,27,'#f8d56e55');rect(x-11,yy-16,22,32,'#f8df85');rect(x-17,yy-6,34,9,'#f8df85');ctx.shadowBlur=0;rect(x-7,yy-8,5,5,'#385951');rect(x+2,yy-8,5,5,'#385951');line(x-5,yy+7,x+5,yy+7,'#7c6240',3);rect(x-90,190,180,46,'#17352eef');ctx.fillStyle='#ffeb9b';ctx.font='bold 17px Microsoft YaHei';ctx.fillText(treeLabel(tr),x,209);ctx.fillStyle='#f6ebc1';ctx.font='12px Microsoft YaHei';ctx.fillText('四种武器均可 · 按住 A',x,227);}else{rect(x-96,193,192,27,'#15342dcf');ctx.fillStyle=tr.totem?'#c6cfb6':'#b4c9b5';ctx.font='13px Microsoft YaHei';ctx.fillText(treeLabel(tr),x,211);}
if(near||tr.hp<15||tr.hit>0){rect(x-96,358,192,52,'#112e2deb');rect(x-80,369,160,7,'#63786b');rect(x-80,369,160*(15-tr.hp)/15,7,'#f8dc83');ctx.fillStyle='#f5edd0';ctx.font='13px Microsoft YaHei';ctx.fillText(weapons[selected].name+'：还需命中 '+Math.ceil(tr.hp/weapons[selected].dmg)+' 次',x,398);}
if(tr.hit>0){ctx.fillStyle='#fff3a9';ctx.font='bold 17px Microsoft YaHei';ctx.fillText('命中 −'+tr.lastDamage,x+58,440-(.3-tr.hit)*45);}ctx.restore();}
function attack(){const w=weapons[selected];player.cd=w.cool;player.attack=.16;attackSerial++;if(selected===3){shots.push({x:player.x+14+player.face*20,y:player.y+22,vx:player.face*460,life:1,damage:1});return;}const center=player.x+14;world.enemies.forEach(e=>{const dx=e.x+15-center;if(e.alive&&Math.abs(dx)<w.range&&dx*player.face>-18&&Math.abs(e.y+16-(player.y+23))<62)hitEnemy(e,w.dmg)});world.trees.forEach(tr=>{const dx=tr.x-center;if(Math.abs(dx)<w.range&&dx*player.face>-18){hitTree(tr,w.dmg);}});}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function step(dt){if(state!=='playing')return;t+=dt;messageTime-=dt;if(messageTime<=0)document.getElementById('toast').hidden=true;player.inv=Math.max(0,player.inv-dt);player.cd-=dt;player.attack=Math.max(0,player.attack-dt);let direction=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);player.vx=direction*SPEED;if(direction)player.face=direction;const tree=world.trees.find(tr=>Math.abs(player.x+14-tr.x)<38);player.climb=!!tree&&(keys.ArrowUp||keys.ArrowDown)&&player.y+player.h>315;
if(player.climb){player.vy=keys.ArrowUp?-170:190;player.ground=false;}else{if(just.ArrowUp&&player.ground){player.vy=JUMP;player.ground=false;}player.vy+=GRAV*dt;}const oldBottom=player.y+player.h;player.x=Math.max(0,Math.min(world.len-28,player.x+player.vx*dt));player.y+=player.vy*dt;player.ground=false;
const overHole=world.holes.some(h=>player.x+player.w*.65>h.x&&player.x+player.w*.35<h.x+h.w);if(!overHole&&oldBottom<=G+3&&player.y+player.h>=G&&player.vy>=0){player.y=G-player.h;player.vy=0;player.ground=true;}
if(!keys.ArrowDown&&!player.climb)for(const p of world.platforms)if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y+3&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;}
if((keys.a||keys.A)&&player.cd<=0)attack();
for(const s of world.spikes)if(overlap(player,{x:s.x+4,y:G-19,w:s.w-8,h:19}))hurt(1);
for(const trap of world.traps)if((t+trap.phase)%3.2>2.25&&overlap(player,{x:trap.x,y:G-76,w:trap.w,h:76}))hurt(1);
for(const e of world.enemies){if(!e.alive)continue;e.hit=Math.max(0,e.hit-dt);e.x+=e.dir*(42+level*1.2)*dt;if(Math.abs(e.x-e.home)>40)e.dir*=-1;if(overlap(player,e))hurt(1);}
for(const s of shots){s.x+=s.vx*dt;s.life-=dt;for(const e of world.enemies)if(e.alive&&s.life>0&&overlap({x:s.x-9,y:s.y-9,w:18,h:18},e)){hitEnemy(e,s.damage);s.life=0;}for(const tr of world.trees)if(s.life>0&&Math.abs(s.x-tr.x)<15&&s.y>330&&s.y<G){s.life=0;hitTree(tr,s.damage);}}
shots=shots.filter(s=>s.life>0);for(const item of world.items)if(item.alive&&Math.abs(player.x+14-item.x)<35&&Math.abs(player.y+23-item.y)<40){if(item.type==='apple'){if(player.hp===6)continue;player.hp=Math.min(6,player.hp+2);toast('金苹果 · 恢复 2 颗心');}else if(item.type==='totem'){player.totem++;toast('获得不死图腾 · 抵挡一次致命伤');}else{owned[item.weapon]=true;selected=item.weapon;toast(`获得${weapons[selected].name} · 伤害 ${weapons[selected].dmg}`);persist();}item.alive=false;burst(item.x,item.y,'#ffed8c');hud();}
if(player.x>world.flag&&checkpoint===75){checkpoint=world.flag+35;toast('路标已点亮 · 复活从这里继续');}
if(player.y>H+60)hurt(2,true);world.trees.forEach(tr=>tr.hit=Math.max(0,tr.hit-dt));particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);camera=Math.max(0,Math.min(world.len-W,player.x-W*.35));if(player.x>world.portal-25&&state==='playing'){state=level===20?'won':'clear';if(level===20){panel('叶芽，成为勇者','二十片风景，二十次勇敢向前。<br>你已穿过丛林、紫焰、大海和冰雪，完成全部冒险！','<button class="primary" onclick="start()">再来一次旅程</button>');}else{panel('这一程，完成！',`第 ${level} 关已通过 · ${world.theme.name}<br>下一站：${themes[Math.floor(level/5)].name} · 第 ${level+1} 关`,'<button class="primary" onclick="nextLevel()">向下一关出发 →</button>');}}just={};}
function nextLevel(){if(state==='clear'){level++;loadLevel();}}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x,y,x2,y2,c,width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function draw(){const th=world.theme,region=Math.floor((level-1)/5);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,th.sky);sky.addColorStop(1,th.haze);rect(0,0,W,H,sky);ellipse(865-camera*.04,110,53,53,region===1?'#f6a08a':'#dcebc8');ellipse(846-camera*.04,96,47,47,th.sky);
for(let i=0;i<30;i++){const x=((i*197-camera*.13)%1250+1250)%1250;ellipse(x,60+(i*67)%300,1.4,1.4,th.accent);}for(let i=0;i<12;i++){const x=i*170-(camera*.24%170);ctx.fillStyle=th.far;ctx.beginPath();ctx.moveTo(x-130,G);ctx.lineTo(x+40,140+(i%3)*35);ctx.lineTo(x+190,G);ctx.fill();if(region===3){ctx.fillStyle='#9bbbbc';ctx.beginPath();ctx.moveTo(x+40,140+(i%3)*35);ctx.lineTo(x+1,218+(i%3)*35);ctx.lineTo(x+40,197+(i%3)*35);ctx.lineTo(x+73,212+(i%3)*35);ctx.fill();}}
if(region>=2){rect(0,390,W,240,'#397d9b');for(let i=0;i<13;i++)line((i*103-t*15)%1200,415+(i%4)*35,(i*103-t*15)%1200+70,415+(i%4)*35,'#99cfce55',2);}else{for(let i=0;i<10;i++){const x=i*190-(camera*.4%190);rect(x,210,18,300,'#0d302c55');ellipse(x+5,210,70,110,'#0d302c66');}}
